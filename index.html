<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestió d'absències EAP Badalona</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-active { background-color: white; color: #4f46e5; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="text-slate-900 pb-12">

    <div class="bg-indigo-700 pb-32 pt-8 px-4 text-white shadow-lg">
        <div class="max-w-xl mx-auto flex justify-between items-start">
            <div>
                <h1 class="text-2xl font-bold">EAP Badalona</h1>
                <p class="text-indigo-100 text-sm">Gestió d'absències</p>
            </div>
            <div id="sync-status" class="px-3 py-1.5 rounded-full text-[10px] font-bold bg-indigo-600/50 border border-indigo-400/30 text-white">INICIANT...</div>
        </div>
    </div>

    <div class="max-w-xl mx-auto -mt-24 px-4">
        <nav class="flex gap-1 bg-indigo-900/20 p-1.5 rounded-2xl mb-6 backdrop-blur-sm">
            <button onclick="showTab('register')" id="btn-register" class="flex-1 py-3 rounded-xl text-[10px] font-bold nav-active">REGISTRE</button>
            <button onclick="showTab('summary')" id="btn-summary" class="flex-1 py-3 rounded-xl text-[10px] font-bold text-white/80">LLISTA</button>
            <button onclick="showTab('ranking')" id="btn-ranking" class="flex-1 py-3 rounded-xl text-[10px] font-bold text-white/80">RÀNQUING</button>
            <button onclick="showTab('export')" id="btn-export" class="flex-1 py-3 rounded-xl text-[10px] font-bold text-white/80">IMPRIMIR</button>
            <button onclick="showTab('settings')" id="btn-settings" class="flex-1 py-3 rounded-xl text-[10px] font-bold text-white/80">EQUIP</button>
        </nav>

        <main class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
            
            <section id="tab-register" class="tab-content active p-6">
                <form onsubmit="handleAbsenceSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">Professional</label>
                        <select id="reg-professional" required class="w-full p-4 border rounded-2xl bg-slate-50 outline-none"></select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">Data</label>
                            <input type="date" id="reg-date" required class="w-full p-4 border rounded-2xl bg-slate-50 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">Motiu</label>
                            <select id="reg-type" onchange="toggleObs()" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none">
                                <option>Malaltia</option>
                                <option>Assumptes propis</option>
                                <option>Formació</option>
                                <option value="Altres">Altres (especificar)</option>
                            </select>
                        </div>
                    </div>
                    <div id="obs-container" class="hidden">
                        <label class="block text-xs font-bold text-indigo-600 mb-2 uppercase">Justificació necessària</label>
                        <textarea id="reg-obs" class="w-full p-4 border border-indigo-100 rounded-2xl bg-indigo-50/30 outline-none" placeholder="Per què és l'absència?"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-5 rounded-2xl shadow-lg active:scale-95 transition-all">GUARDAR REGISTRE</button>
                </form>
            </section>

            <section id="tab-summary" class="tab-content p-6">
                <div class="flex justify-between items-center mb-6"><h2 class="font-bold">Darrers registres</h2></div>
                <div class="space-y-3" id="summary-list"></div>
            </section>

            <section id="tab-ranking" class="tab-content p-6">
                <h2 class="font-bold mb-6 text-slate-700">Absències per professional</h2>
                <div class="space-y-5" id="ranking-list"></div>
            </section>

            <section id="tab-export" class="tab-content p-6">
                <h2 class="font-bold mb-2">Generar Informe</h2>
                <p class="text-xs text-slate-400 mb-6">Selecciona les dates per crear un llistat per imprimir.</p>
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-1">INICI</label>
                            <input type="date" id="exp-start" class="w-full p-3 border rounded-xl bg-slate-50 text-sm outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-1">FINAL</label>
                            <input type="date" id="exp-end" class="w-full p-3 border rounded-xl bg-slate-50 text-sm outline-none">
                        </div>
                    </div>
                    <button onclick="generatePrintReport()" class="w-full bg-slate-800 text-white py-5 rounded-2xl font-bold text-sm uppercase tracking-wider shadow-lg">Generar i Imprimir</button>
                </div>
            </section>

            <section id="tab-settings" class="tab-content p-6">
                <div class="flex gap-2 mb-8">
                    <input type="text" id="new-prof" class="flex-1 p-4 border rounded-2xl bg-slate-50 outline-none" placeholder="Nom professional...">
                    <button onclick="addProf()" class="bg-indigo-600 text-white px-6 rounded-2xl font-bold text-xl">+</button>
                </div>
                <div class="space-y-2" id="prof-list"></div>
            </section>
        </main>
    </div>

    <div id="modal-pass" class="modal fixed inset-0 bg-slate-900/60 backdrop-blur-sm items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-3xl w-full max-w-xs text-center shadow-2xl">
            <p class="font-bold text-slate-700 mb-6 text-sm uppercase">Seguretat</p>
            <input type="password" id="pass-val" class="w-full p-4 border rounded-2xl mb-6 text-center outline-none bg-slate-50">
            <div class="flex gap-3">
                <button onclick="document.getElementById('modal-pass').classList.remove('active')" class="flex-1 py-4 text-slate-400 text-[10px] font-bold">CANCEL·LAR</button>
                <button onclick="confirmAction()" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl text-[10px] font-bold uppercase">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIVw0ivg7bc_cZBms7RiXDGtk-6u8gaos9OmxMl8aYZ42DWIU049UEtDLKvdpp7COtdQ/exec"; // ENGANXA AQUÍ LA TEVA URL

        let professionals = JSON.parse(localStorage.getItem('eap_prof_backup')) || [];
        let absences = JSON.parse(localStorage.getItem('eap_abs_backup')) || [];
        let pendingAction = null;

        function setStatus(txt, cls) {
            const el = document.getElementById('sync-status');
            el.textContent = txt;
            el.className = `px-3 py-1.5 rounded-full text-[10px] font-bold ${cls}`;
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            document.querySelectorAll('nav button').forEach(b => b.className = "flex-1 py-3 rounded-xl text-[10px] font-bold transition-all text-white/80");
            document.getElementById('btn-' + id).className = "flex-1 py-3 rounded-xl text-[10px] font-bold transition-all nav-active";
        }

        function toggleObs() {
            const type = document.getElementById('reg-type').value;
            const container = document.getElementById('obs-container');
            container.classList.toggle('hidden', type !== 'Altres');
        }

        async function manualSync() {
            if (!CONFIG_SCRIPT_URL) return;
            setStatus("CONECTANT...", "bg-white/20 text-white");
            try {
                const res = await fetch(CONFIG_SCRIPT_URL);
                const data = await res.json();
                professionals = data.professionals || [];
                absences = data.absences || [];
                localStorage.setItem('eap_prof_backup', JSON.stringify(professionals));
                localStorage.setItem('eap_abs_backup', JSON.stringify(absences));
                updateUI();
                setStatus("ACTUALITZAT ✓", "bg-emerald-500 text-white font-bold");
            } catch (e) { setStatus("MODE LOCAL", "bg-slate-500 text-white"); updateUI(); }
        }

        async function save() {
            localStorage.setItem('eap_prof_backup', JSON.stringify(professionals));
            localStorage.setItem('eap_abs_backup', JSON.stringify(absences));
            setStatus("GUARDANT...", "bg-amber-500 text-white");
            try {
                await fetch(CONFIG_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ professionals, absences }) });
                setTimeout(manualSync, 2000);
            } catch (e) { setStatus("ERROR XARXA", "bg-red-500 text-white"); }
        }

        function generatePrintReport() {
            const start = document.getElementById('exp-start').value;
            const end = document.getElementById('exp-end').value;
            if(!start || !end) { alert("Has de seleccionar una data d'inici i una de final."); return; }
            
            const filtered = absences.filter(a => a.date >= start && a.date <= end).sort((a,b) => a.date.localeCompare(b.date));
            
            const printWindow = window.open('', '_blank');
            let html = `
                <html>
                <head>
                    <title>Informe d'Absències EAP Badalona</title>
                    <style>
                        body { font-family: sans-serif; padding: 40px; color: #333; }
                        h1 { color: #4f46e5; margin-bottom: 5px; }
                        p { color: #666; margin-bottom: 30px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; font-size: 13px; }
                        th { background-color: #f8fafc; font-weight: bold; }
                        .obs { font-style: italic; color: #666; font-size: 11px; }
                    </style>
                </head>
                <body>
                    <h1>EAP Badalona - Gestió d'Absències</h1>
                    <p>Informe del període: <strong>${start}</strong> fins a <strong>${end}</strong></p>
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Professional</th>
                                <th>Motiu</th>
                                <th>Observacions / Justificació</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filtered.map(a => `
                                <tr>
                                    <td>${a.date}</td>
                                    <td>${a.professional}</td>
                                    <td>${a.type}</td>
                                    <td class="obs">${a.obs || '-'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <script>window.onload = function() { window.print(); window.close(); }<\/script>
                </body>
                </html>
            `;
            printWindow.document.write(html);
            printWindow.document.close();
        }

        function updateUI() {
            const sel = document.getElementById('reg-professional');
            sel.innerHTML = '<option value="">-- Selecciona professional --</option>' + 
                professionals.sort().map(p => `<option>${p}</option>`).join('');
            
            const list = document.getElementById('summary-list');
            list.innerHTML = absences.sort((a,b) => b.ts - a.ts).slice(0,20).map(a => `
                <div class="p-4 bg-slate-50 rounded-2xl flex justify-between items-center border border-slate-100">
                    <div>
                        <p class="font-bold text-sm text-slate-800">${a.professional}</p>
                        <p class="text-[10px] text-slate-400 font-bold uppercase">${a.date} • ${a.type}</p>
                        ${a.obs ? `<p class="text-[10px] text-indigo-500 italic mt-1 font-medium">Justificació: ${a.obs}</p>` : ''}
                    </div>
                    <button onclick="askPass('delAbs', ${a.id})" class="text-slate-300 px-2">✕</button>
                </div>`).join('');

            const rkList = document.getElementById('ranking-list');
            const counts = {}; professionals.forEach(p => counts[p] = 0);
            absences.forEach(a => { if(counts[a.professional] !== undefined) counts[a.professional]++ });
            const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
            const max = Math.max(...Object.values(counts), 1);
            rkList.innerHTML = sorted.map(([name, count]) => `
                <div class="space-y-1">
                    <div class="flex justify-between text-[10px] font-bold uppercase text-slate-500"><span>${name}</span><span>${count}</span></div>
                    <div class="bg-slate-100 h-2 rounded-full"><div class="bg-indigo-500 h-full rounded-full" style="width: ${(count/max)*100}%"></div></div>
                </div>`).join('');

            const plist = document.getElementById('prof-list');
            plist.innerHTML = professionals.sort().map(p => `
                <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center text-sm">
                    <span class="font-semibold text-slate-600">${p}</span>
                    <button onclick="askPass('delProf', '${p}')" class="text-red-400 text-[10px] font-bold">ELIMINAR</button>
                </div>`).join('');
        }

        function addProf() {
            const v = document.getElementById('new-prof').value.trim();
            if (v && !professionals.includes(v)) { professionals.push(v); document.getElementById('new-prof').value=""; updateUI(); save(); }
        }

        function handleAbsenceSubmit(e) {
            e.preventDefault();
            const p = document.getElementById('reg-professional').value;
            const d = document.getElementById('reg-date').value;
            const t = document.getElementById('reg-type').value;
            const o = document.getElementById('reg-obs').value;
            if (!p || !d) return;
            if (t === 'Altres' && !o) { alert("Has d'especificar el motiu a l'apartat de justificació."); return; }
            
            absences.push({ id: Date.now(), professional: p, date: d, type: t, obs: o, ts: new Date(d).getTime() });
            updateUI(); save();
            e.target.reset(); 
            document.getElementById('reg-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('obs-container').classList.add('hidden');
        }

        function askPass(action, id) { pendingAction = { action, id }; document.getElementById('modal-pass').classList.add('active'); }
        function confirmAction() {
            if (document.getElementById('pass-val').value === "eapb55bdn") {
                if (pendingAction.action === 'delProf') professionals = professionals.filter(p => p !== pendingAction.id);
                if (pendingAction.action === 'delAbs') absences = absences.filter(a => a.id !== pendingAction.id);
                updateUI(); save();
                document.getElementById('modal-pass').classList.remove('active');
            } else alert("Contrasenya incorrecta");
            document.getElementById('pass-val').value = "";
        }

        document.addEventListener('DOMContentLoaded', () => {
            const avui = new Date().toISOString().split('T')[0];
            document.getElementById('reg-date').value = avui;
            document.getElementById('exp-start').value = avui;
            document.getElementById('exp-end').value = avui;
            updateUI();
            manualSync();
        });
    </script>
</body>
</html>
