<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestió d'Absentisme EAP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div class="max-w-xl mx-auto p-4 md:p-6">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-700">Absentisme EAP</h1>
            <div id="sync-status" class="px-3 py-1 rounded-full text-[10px] font-bold bg-slate-200 text-slate-500">
                INICIANT...
            </div>
        </header>

        <nav class="flex gap-1 bg-slate-200 p-1 rounded-xl mb-6 text-sm font-medium">
            <button onclick="showTab('register')" class="flex-1 py-2 rounded-lg bg-white shadow-sm text-indigo-600" id="btn-register">Registrar</button>
            <button onclick="showTab('summary')" class="flex-1 py-2 rounded-lg" id="btn-summary">Resum</button>
            <button onclick="showTab('settings')" class="flex-1 py-2 rounded-lg" id="btn-settings">Plantilla</button>
        </nav>

        <main class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <section id="tab-register" class="tab-content active">
                <form onsubmit="handleAbsenceSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Professional</label>
                        <select id="reg-professional" required class="w-full p-3 border rounded-xl bg-slate-50"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Data</label>
                        <input type="date" id="reg-date" required class="w-full p-3 border rounded-xl bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Tipus</label>
                        <select id="reg-type" class="w-full p-3 border rounded-xl bg-slate-50">
                            <option>Malaltia</option><option>Assumptes propis</option><option>Formació</option><option>Altres</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-indigo-700 transition-colors">GUARDAR REGISTRE</button>
                </form>
            </section>

            <section id="tab-summary" class="tab-content">
                <div class="flex justify-between mb-4">
                    <h2 class="font-bold">Darrers registres</h2>
                    <button onclick="manualSync()" class="text-indigo-600 text-xs font-bold uppercase tracking-wider">⟳ Actualitzar</button>
                </div>
                <div class="divide-y" id="summary-list"></div>
            </section>

            <section id="tab-settings" class="tab-content">
                <div class="flex gap-2 mb-6">
                    <input type="text" id="new-prof" class="flex-1 p-3 border rounded-xl" placeholder="Nou professional">
                    <button onclick="addProf()" class="bg-emerald-600 text-white px-4 rounded-xl font-bold">+</button>
                </div>
                <div class="divide-y mb-8" id="prof-list"></div>
                <div class="pt-6 border-t text-center">
                    <p class="text-[10px] text-slate-400 italic">La configuració del servidor està integrada en el codi.</p>
                </div>
            </section>
        </main>
    </div>

    <div id="modal-pass" class="modal fixed inset-0 bg-slate-900/50 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl w-full max-w-xs text-center shadow-2xl">
            <p class="font-bold mb-4 text-slate-700">Contrasenya de seguretat</p>
            <input type="password" id="pass-val" class="w-full p-3 border rounded-xl mb-4 text-center tracking-widest">
            <div class="flex gap-2">
                <button onclick="document.getElementById('modal-pass').classList.remove('active')" class="flex-1 bg-slate-100 py-3 rounded-xl font-bold text-slate-400 text-[10px]">CANCEL·LAR</button>
                <button onclick="confirmAction()" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold text-[10px]">CONFIRMAR</button>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // CONFIGURACIÓ FIXA: ENGANXA LA TEVA URL AQUÍ
        // ================================================================
        const CONFIG_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzMorFqfQK5KDHLa6eJpNLyR9mNy1fbK9k9QZIpQaFBGJq7bWzpFga2GtL6V4M-i0v13Q/exec"; 
        // ================================================================

        let professionals = JSON.parse(localStorage.getItem('eap_prof_backup')) || [];
        let absences = JSON.parse(localStorage.getItem('eap_abs_backup')) || [];
        let pendingAction = null;

        function setStatus(txt, cls) {
            const el = document.getElementById('sync-status');
            el.textContent = txt;
            el.className = `px-3 py-1 rounded-full text-[10px] font-bold ${cls}`;
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('bg-white', 'shadow-sm', 'text-indigo-600'));
            document.getElementById('btn-' + id).classList.add('bg-white', 'shadow-sm', 'text-indigo-600');
        }

        async function manualSync() {
            if (!CONFIG_SCRIPT_URL || CONFIG_SCRIPT_URL.includes("EL_TEU_URL")) { 
                setStatus("URL NO CONFIGURADA", "bg-red-100 text-red-600"); 
                return; 
            }
            
            setStatus("SINCRONITZANT...", "bg-blue-100 text-blue-600");
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                const res = await fetch(CONFIG_SCRIPT_URL, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                const data = await res.json();
                professionals = data.professionals || [];
                absences = data.absences || [];
                
                localStorage.setItem('eap_prof_backup', JSON.stringify(professionals));
                localStorage.setItem('eap_abs_backup', JSON.stringify(absences));
                
                updateUI();
                setStatus("AL NÚVOL ✓", "bg-emerald-100 text-emerald-600");
            } catch (e) {
                setStatus("DADES LOCALS", "bg-slate-200 text-slate-500");
                updateUI();
            }
        }

        async function save() {
            if (!CONFIG_SCRIPT_URL || CONFIG_SCRIPT_URL.includes("EL_TEU_URL")) return;
            
            localStorage.setItem('eap_prof_backup', JSON.stringify(professionals));
            localStorage.setItem('eap_abs_backup', JSON.stringify(absences));

            setStatus("GUARDANT...", "bg-amber-100 text-amber-600");
            
            try {
                await fetch(CONFIG_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ professionals, absences })
                });
                setTimeout(manualSync, 2000);
            } catch (e) {
                setStatus("ERROR XARXA", "bg-red-100 text-red-600");
            }
        }

        function updateUI() {
            const sel = document.getElementById('reg-professional');
            const currentSel = sel.value;
            sel.innerHTML = '<option value="">-- Selecciona --</option>' + 
                professionals.sort().map(p => `<option ${currentSel === p ? 'selected' : ''}>${p}</option>`).join('');
            
            const list = document.getElementById('summary-list');
            list.innerHTML = absences.length === 0 ? '<p class="py-8 text-center text-slate-400 text-sm italic">Sense dades</p>' :
                absences.sort((a,b) => b.ts - a.ts).slice(0,20).map(a => `
                    <div class="py-3 flex justify-between items-center">
                        <div>
                            <p class="font-bold text-sm text-slate-700">${a.professional}</p>
                            <p class="text-[10px] text-slate-400 font-medium">${a.date} — ${a.type.toUpperCase()}</p>
                        </div>
                        <button onclick="askPass('delAbs', ${a.id})" class="w-8 h-8 text-slate-300 hover:text-red-400">✕</button>
                    </div>`).join('');

            const plist = document.getElementById('prof-list');
            plist.innerHTML = professionals.sort().map(p => `
                <div class="py-2 flex justify-between items-center text-sm border-b border-slate-50">
                    <span class="text-slate-600">${p}</span>
                    <button onclick="askPass('delProf', '${p}')" class="text-red-400 text-[10px] font-bold uppercase">Eliminar</button>
                </div>`).join('');
        }

        function addProf() {
            const v = document.getElementById('new-prof').value.trim();
            if (v && !professionals.includes(v)) { 
                professionals.push(v); 
                document.getElementById('new-prof').value=""; 
                updateUI(); save(); 
            }
        }

        function handleAbsenceSubmit(e) {
            e.preventDefault();
            const p = document.getElementById('reg-professional').value;
            const d = document.getElementById('reg-date').value;
            const t = document.getElementById('reg-type').value;
            if (!p || !d) return;
            absences.push({ id: Date.now(), professional: p, date: d, type: t, ts: new Date(d).getTime() });
            updateUI(); save();
            e.target.reset(); document.getElementById('reg-date').valueAsDate = new Date();
        }

        function askPass(action, id) { 
            pendingAction = { action, id }; 
            document.getElementById('modal-pass').classList.add('active'); 
            document.getElementById('pass-val').focus();
        }
        
        function confirmAction() {
            if (document.getElementById('pass-val').value === "eapb55bdn") {
                if (pendingAction.action === 'delProf') professionals = professionals.filter(p => p !== pendingAction.id);
                if (pendingAction.action === 'delAbs') absences = absences.filter(a => a.id !== pendingAction.id);
                updateUI(); save();
                document.getElementById('modal-pass').classList.remove('active');
            } else { alert("Contrasenya incorrecta"); }
            document.getElementById('pass-val').value = "";
        }

        // --- INICI ---
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('reg-date').valueAsDate = new Date();
            updateUI();
            manualSync();
        });
    </script>
</body>
</html>
