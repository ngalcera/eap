<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestió d'Absentisme EAP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div class="max-w-xl mx-auto p-4 md:p-6">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-700">Absentisme EAP</h1>
            <div id="sync-status" class="px-3 py-1 rounded-full text-[10px] font-bold bg-slate-200 text-slate-500">
                CARREGANT...
            </div>
        </header>

        <nav class="flex gap-1 bg-slate-200 p-1 rounded-xl mb-6 text-sm font-medium">
            <button onclick="showTab('register')" class="flex-1 py-2 rounded-lg" id="btn-register">Registrar</button>
            <button onclick="showTab('summary')" class="flex-1 py-2 rounded-lg" id="btn-summary">Resum</button>
            <button onclick="showTab('settings')" class="flex-1 py-2 rounded-lg" id="btn-settings">Plantilla</button>
        </nav>

        <main class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <section id="tab-register" class="tab-content active">
                <form onsubmit="handleAbsenceSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Professional</label>
                        <select id="reg-professional" required class="w-full p-3 border rounded-xl bg-slate-50"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Data</label>
                        <input type="date" id="reg-date" required class="w-full p-3 border rounded-xl bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Tipus</label>
                        <select id="reg-type" class="w-full p-3 border rounded-xl bg-slate-50">
                            <option>Malaltia</option><option>Assumptes propis</option><option>Formació</option><option>Altres</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg">GUARDAR REGISTRE</button>
                </form>
            </section>

            <section id="tab-summary" class="tab-content">
                <div class="flex justify-between mb-4">
                    <h2 class="font-bold">Darrers registres</h2>
                    <button onclick="manualSync()" class="text-indigo-600 text-xs font-bold">⟳ Actualitzar</button>
                </div>
                <div class="divide-y" id="summary-list"></div>
            </section>

            <section id="tab-settings" class="tab-content">
                <div class="flex gap-2 mb-6">
                    <input type="text" id="new-prof" class="flex-1 p-3 border rounded-xl" placeholder="Nou professional">
                    <button onclick="addProf()" class="bg-emerald-600 text-white px-4 rounded-xl font-bold">+</button>
                </div>
                <div class="divide-y mb-8" id="prof-list"></div>
                <div class="pt-6 border-t">
                    <label class="block text-xs font-bold text-slate-400 mb-2">URL GOOGLE SCRIPT</label>
                    <input type="text" id="script-url" class="w-full p-2 border rounded text-[10px] font-mono mb-2">
                    <button onclick="saveConfig()" class="w-full bg-slate-800 text-white py-2 rounded-lg text-xs font-bold">ACTUALITZAR CONNEXIÓ</button>
                </div>
            </section>
        </main>
    </div>

    <div id="modal-pass" class="modal fixed inset-0 bg-slate-900/50 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl w-full max-w-xs text-center">
            <p class="font-bold mb-4">Contrasenya</p>
            <input type="password" id="pass-val" class="w-full p-3 border rounded-xl mb-4 text-center">
            <button onclick="confirmAction()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold">OK</button>
        </div>
    </div>

    <script>
        let professionals = [];
        let absences = [];
        let scriptUrl = localStorage.getItem('eap_script_url') || "";
        let pendingAction = null;

        function setStatus(txt, cls) {
            const el = document.getElementById('sync-status');
            el.textContent = txt;
            el.className = `px-3 py-1 rounded-full text-[10px] font-bold ${cls}`;
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
        }

        async function manualSync() {
            if (!scriptUrl) { setStatus("SENSE URL", "bg-amber-100 text-amber-600"); return; }
            setStatus("SINCRONITZANT...", "bg-blue-100 text-blue-600");
            try {
                const res = await fetch(scriptUrl);
                const data = await res.json();
                professionals = data.professionals || [];
                absences = data.absences || [];
                updateUI();
                setStatus("AL NÚVOL ✓", "bg-emerald-100 text-emerald-600");
            } catch (e) { setStatus("ERROR XARXA", "bg-red-100 text-red-600"); }
        }

        async function save() {
            if (!scriptUrl) return;
            setStatus("GUARDANT...", "bg-amber-100 text-amber-600");
            try {
                await fetch(scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ professionals, absences })
                });
                setTimeout(manualSync, 1500);
            } catch (e) { setStatus("ERROR AL GUARDAR", "bg-red-100 text-red-600"); }
        }

        function updateUI() {
            const sel = document.getElementById('reg-professional');
            sel.innerHTML = '<option value="">-- Selecciona --</option>' + professionals.map(p => `<option>${p}</option>`).join('');
            
            const list = document.getElementById('summary-list');
            list.innerHTML = absences.sort((a,b) => b.ts - a.ts).slice(0,15).map(a => `
                <div class="py-3 flex justify-between">
                    <div><p class="font-bold text-sm">${a.professional}</p><p class="text-[10px] text-slate-400">${a.date} - ${a.type}</p></div>
                    <button onclick="askPass('delAbs', ${a.id})" class="text-red-300">✕</button>
                </div>`).join('');

            const plist = document.getElementById('prof-list');
            plist.innerHTML = professionals.map(p => `
                <div class="py-2 flex justify-between text-sm"><span>${p}</span><button onclick="askPass('delProf', '${p}')" class="text-red-400">Eliminar</button></div>`).join('');
        }

        function addProf() {
            const v = document.getElementById('new-prof').value.trim();
            if (v) { professionals.push(v); professionals.sort(); document.getElementById('new-prof').value=""; save(); updateUI(); }
        }

        function handleAbsenceSubmit(e) {
            e.preventDefault();
            const p = document.getElementById('reg-professional').value;
            const d = document.getElementById('reg-date').value;
            const t = document.getElementById('reg-type').value;
            if (!p || !d) return;
            absences.push({ id: Date.now(), professional: p, date: d, type: t, ts: new Date(d).getTime() });
            save(); updateUI();
            e.target.reset(); document.getElementById('reg-date').valueAsDate = new Date();
        }

        function askPass(action, id) { pendingAction = { action, id }; document.getElementById('modal-pass').classList.add('active'); }
        
        function confirmAction() {
            if (document.getElementById('pass-val').value === "eapb55bdn") {
                if (pendingAction.action === 'delProf') professionals = professionals.filter(p => p !== pendingAction.id);
                if (pendingAction.action === 'delAbs') absences = absences.filter(a => a.id !== pendingAction.id);
                save(); updateUI();
            }
            document.getElementById('modal-pass').classList.remove('active');
            document.getElementById('pass-val').value = "";
        }

        function saveConfig() {
            scriptUrl = document.getElementById('script-url').value.trim();
            localStorage.setItem('eap_script_url', scriptUrl);
            manualSync();
        }

        // Init
        document.getElementById('reg-date').valueAsDate = new Date();
        document.getElementById('script-url').value = scriptUrl;
        if (scriptUrl) manualSync(); else updateUI();
    </script>
</body>
</html>
